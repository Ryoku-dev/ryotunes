[workspace]
resolver = "2"
members = [
    "crates/innertube",
    "crates/player",
    "crates/listen-protocol",
    "crates/sync-server",
    "crates/core",
    "crates/spotify",
    "crates/soundcloud",
    "crates/protocol",
    "crates/ryotunesd",
    "crates/ryotunes-cli",
    "src-tauri",
]

[workspace.package]
version = "1.0.3"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
listen-protocol = { path = "crates/listen-protocol" }
async-trait = "0.1"
ryotunes-core = { path = "crates/core" }
ryotunes-protocol = { path = "crates/protocol" }

# Release profile: thin LTO + one codegen unit for cross-crate optimization, symbols stripped
# for size: the desktop package should stay lean without changing runtime behaviour.
# panic stays "unwind": an abort in the mpv event thread or a tokio task would kill playback
# for the whole app instead of degrading.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Spotify streaming (crates/spotify) needs librespot 0.8 with nolight132's librespot-audio fix; the
# whole set is pinned to the fork rev Sonora uses so the librespot crates stay mutually consistent.
# No other workspace crate depends on librespot, so this only affects crates/spotify.
[patch.crates-io]
librespot-audio = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
librespot-core = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
librespot-metadata = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
librespot-oauth = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
librespot-playback = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
librespot-protocol = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
