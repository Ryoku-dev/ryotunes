name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install checkout prerequisites
        run: pacman -Syu --noconfirm --needed git glibc
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive and notes
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p dist
          git archive --format=tar --prefix="ryotunes-$version/" HEAD | gzip -n > "dist/ryotunes-$version.tar.gz"
          (cd dist && sha256sum "ryotunes-$version.tar.gz" > "ryotunes-$version.tar.gz.sha256")
          ./release/release-notes.sh "$version" > dist/RELEASE_NOTES.md
      - name: Build Arch package
        run: ./release/build-arch-package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ryotunes-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ryotunes-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          assets=(
            "dist/ryotunes-$version-1-x86_64.pkg.tar.zst"
            "dist/ryotunes-$version-1-x86_64.pkg.tar.zst.sha256"
            "dist/ryotunes-$version.tar.gz"
            "dist/ryotunes-$version.tar.gz.sha256"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Ryotunes $version" \
              --notes-file dist/RELEASE_NOTES.md
          fi
