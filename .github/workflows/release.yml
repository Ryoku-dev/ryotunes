name: Release

# One pipeline, keyed on a `v*` tag (cut with `scripts/release.sh patch --push`):
#   1. verify:  the tag's tree builds (every binary + the web UI) and the release
#      invariants hold, on a stock Ubuntu runner, so a release never ships broken;
#   2. package: an unprivileged `makepkg` in an Arch container builds the tag's
#      exact source into the prebuilt pacman package
#      `ryotunes-<version>-1-x86_64.pkg.tar.zst` (+ its sha256);
#   3. publish: a normal (non-draft, non-prerelease) GitHub release carrying that
#      package + sha256 and a reproducible source tarball + sha256, with the
#      changelog section as the notes. External clients (Ryoku's `update` and
#      `doctor`) read this release directly from GitHub; there is no downstream
#      repository_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v2.5.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build the tagged tree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version
        id: meta
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$tag" != "v$ver" ]]; then
            echo "::error::tag $tag does not match Cargo.toml version $ver (cut releases with scripts/release.sh)"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Release invariants
        run: python3 scripts/check-release-invariants.py

      - name: Build the web UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build every binary
        run: cargo build --release --locked --package ryotunes --package ryotunesd --package ryotunes-cli

      - name: Skins validate
        run: |
          for d in skins/*/; do target/release/ryotunes-cli skin check "$d"; done

      - name: Unit tests
        run: cargo test --workspace --locked --exclude ryotunes

  package:
    name: Build the Arch package
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      # actions/checkout needs git present in the container before it can run.
      - name: Install git for checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      # The shared script is what a maintainer runs locally too
      # (docker run ... archlinux:latest scripts/build-arch-package.sh); here it
      # runs as root, sets up an unprivileged builder, and re-execs itself. It
      # builds this checked-out tag's exact source, pins pkgrel to 1, and writes
      # ryotunes-<version>-1-x86_64.pkg.tar.zst (+ .sha256) into dist/.
      - name: Build the package
        run: scripts/build-arch-package.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/ryotunes-*-x86_64.pkg.tar.zst*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Fetch the Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - name: Source tarball
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="ryotunes-$VERSION"
          # git archive is reproducible for a tag: same tree, same bytes.
          git archive --format=tar --prefix="$name/" "$TAG" | gzip -n > "dist/$name.tar.gz"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 - <<'PY' > dist/NOTES.md
          import os, re
          v = os.environ["VERSION"]
          s = open("CHANGELOG.md").read()
          m = re.search(rf"^## v{re.escape(v)}[^\n]*\n(.*?)(?=^## |\Z)", s, re.S | re.M)
          print((m.group(1).strip() if m else f"Ryotunes v{v}.") + "\n")
          PY
          cat dist/NOTES.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # A normal published (non-draft, non-prerelease, latest) release is what
          # /repos/neur0map/ryotunes/releases/latest returns to Ryoku's clients.
          assets=(dist/*.tar.gz dist/*.pkg.tar.zst dist/*.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest --notes-file dist/NOTES.md
          else
            gh release create "$TAG" "${assets[@]}" --latest --title "Ryotunes $TAG" --notes-file dist/NOTES.md
          fi
