name: Release Fedora RPM

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-fedora
  cancel-in-progress: false

jobs:
  package:
    name: Build Fedora packages
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install rpm-build rust cargo gcc gcc-c++ pkgconf-pkg-config \
            openssl-devel sqlite-devel mpv-devel webkit2gtk4.1-devel \
            systemd-rpm-macros desktop-file-utils python3 git patch

      - uses: actions/checkout@v4

      - name: Build companion and application RPMs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/fedora/build-companion.sh
          packaging/fedora/build.sh

      - name: Preserve Fedora packages
        uses: actions/upload-artifact@v4
        with:
          name: fedora-packages
          path: |
            fedora-out/RPMS/**/*.rpm
            fedora-out/SRPMS/*.src.rpm
            fedora-out/companion/RPMS/**/*.rpm
            fedora-out/companion/SRPMS/*.src.rpm
          if-no-files-found: error

  copr:
    name: Submit Fedora builds to Copr
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: registry.fedoraproject.org/fedora:44
    env:
      COPR_PROJECT: ${{ vars.COPR_PROJECT }}
    steps:
      - name: Install Copr client
        run: dnf -y install copr-cli

      - name: Fetch Fedora packages
        uses: actions/download-artifact@v4
        with:
          name: fedora-packages
          path: fedora-out

      - name: Setup Copr configuration
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          : "${COPR_CONFIG:?Set the COPR_CONFIG repository secret}"
          : "${COPR_PROJECT:?Set the COPR_PROJECT repository variable to owner/project}"
          umask 077
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr

      - name: Submit source RPMs and wait for builds
        shell: bash
        run: |
          set -euo pipefail
          # Copr rebuilds the vendored SRPMs using the spec's offline build.
          # Publish the shared runtime first so the application is installable.
          copr-cli build --chroot fedora-44-x86_64 "$COPR_PROJECT" fedora-out/companion/SRPMS/*.src.rpm
          copr-cli build --chroot fedora-44-x86_64 "$COPR_PROJECT" fedora-out/SRPMS/*.src.rpm

      - name: Remove Copr credentials
        if: always()
        run: rm -f ~/.config/copr
