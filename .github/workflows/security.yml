name: Security audit

on:
  push:
    branches:
      - main
      - v2.4.1
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/audit.toml
      - SECURITY.md
      - crates/**/Cargo.toml
      - src-tauri/Cargo.toml
      - ui/package.json
      - ui/pnpm-lock.yaml
      - .github/workflows/security.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependency graph
        run: cargo audit

  frontend:
    name: Frontend dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production frontend dependency graph
        working-directory: ui
        run: pnpm audit --prod --audit-level high
