[package]
name = "ryotunes-spotify"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Ryotunes Spotify provider: librespot metadata + pipe-to-mpv streaming. Lifted from nolight132/sonora."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
bytes = "1"
http = "1"
log = "0.4"
protobuf = "3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }

librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = "0.8.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Resolver pin, not used directly: librespot-core's build script uses vergen-gitcl 1.0.8, which
# depends on vergen-lib 0.1.x. vergen 9.1.0 bumped vergen-lib to 9.x, so cargo pairing them breaks
# librespot-core's build.rs (two vergen-lib versions). Constrain the shared `vergen` build-dep to
# 9.0.6 (the version Sonora locks) so any re-resolution stays consistent.
[build-dependencies]
vergen = "=9.0.6"
