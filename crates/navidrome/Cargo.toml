[package]
name = "ryotunes-navidrome"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ryotunes Navidrome provider: salted-token Subsonic/OpenSubsonic sign-in, catalogue models and the request funnel."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
md-5 = "0.10"
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12"
tokio = { workspace = true, features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
