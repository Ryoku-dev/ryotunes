[package]
name = "ryotunes-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ryotunes playback core: state, orchestration, integrations. No UI."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "fs", "process"] }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
parking_lot = "0.12"
listen-protocol = { workspace = true }
innertube = { path = "../innertube" }
player = { path = "../player" }
ryotunes-spotify = { path = "../spotify" }
ryotunes-soundcloud = { path = "../soundcloud" }
ryotunes-tidal = { path = "../tidal" }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
regex = "1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
discord-rich-presence = "1.1.0"
md-5 = "0.10"
lofty = "0.22.2"
# Toneless pinyin for lyrics romanization (`romanize.rs`); the plain table only.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
# Japanese readings for romanization (`romanize/japanese.rs`); the dictionary ships as package data.
vibrato = { version = "0.5", default-features = false }
url = "2"
sha2 = "0.10"
tempfile = "3"
# Void self-update: unpack the release .pkg.tar.zst so it can be repacked with xbps-create.
tar = { version = "0.4", default-features = false }
ruzstd = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
