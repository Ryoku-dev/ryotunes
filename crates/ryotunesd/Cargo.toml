[package]
name = "ryotunesd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ryotunes playback daemon"

[[bin]]
name = "ryotunesd"
path = "src/main.rs"

[features]
fedora = ["ryotunes-core/dnf-updates"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "signal", "fs", "process"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
ryotunes-core = { workspace = true }
ryotunes-soundcloud = { path = "../soundcloud" }
ryotunes-protocol = { workspace = true }
innertube = { path = "../innertube" }
player = { path = "../player" }
libc = "0.2"
parking_lot = "0.12"
gtk = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
urlencoding = "2"
# webkit2gtk's `evaluate_javascript` callback hands back a `javascriptcore::Value`; the crate does
# NOT re-export javascriptcore, so `ValueExt::to_json` needs it as a direct dependency (in the lock
# already via webkit2gtk, package `javascriptcore-rs`, so `--locked` is unaffected).
javascriptcore = { package = "javascriptcore-rs", version = "1.1" }
# `session::allowed_login_navigation` takes a `&url::Url`; the GTK policy hook only gives us the URI
# string, so we parse it (Tauri handed a `url::Url` straight to the callback).
url = "2"
# The sign-in window's tests build a fake JWT to feed the cookie harvester (same base64 the
# lock already carries via reqwest).
base64 = "0.22"
# System tray via StatusNotifierItem. `ksni` speaks the protocol directly (left-click `Activate`
# works, unlike libappindicator), the same reason `src-tauri/src/tray.rs` uses it on Linux.
ksni = "0.3"
# Browser-connected SoundCloud sign-in (`browser_auth`): read the session cookies out of the
# user's own browser profile databases (Gecko plaintext, Chromium v10 AES-CBC) instead of an
# embedded webview, so captchas and IdP popups work in the browser they were built for.
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["std", "block-padding"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Download enrichment (`download_media`) embeds cover art + lyrics into the finished audio and reads
# its real duration. Same version core pins so the workspace resolves one `lofty` (in the lock
# already via core, so `--locked` is unaffected).
lofty = "0.22.2"
